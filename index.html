<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCM45pVfshkhb4_oG8VX08S2blYQlA8nSA",
            authDomain: "workout-tracker-3bf5e.firebaseapp.com",
            projectId: "workout-tracker-3bf5e",
            storageBucket: "workout-tracker-3bf5e.firebasestorage.app",
            messagingSenderId: "1051835495537",
            appId: "1:1051835495537:web:d825f0a61ccce60f4bd7d0",
            measurementId: "G-7MK068BRL8"
        };


        firebase.initializeApp(firebaseConfig);
    </script>

</head>

<body>
    <h1>Workout Tracker</h1>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;">

        <div id="dateAndWorkout" style="display:flex; align-items:center; gap:12px;">
            <div id="todayDate" style="font-size:14px; color:#aaa; font-weight:600;"></div>
            <div id="todayWorkout" style=" font-size:18px; font-weight:bold; color:#fff; padding-left:40px;"></div>
        </div>
        <button id="calendarBtn"
            style="margin-left:auto; background:#6c3483; color:#fff; border-radius:8px; padding:12px 20px; font-size:18px; border:none; cursor:pointer;">≡</button>
        <div id="menuDropdown" style="
  display:none;
  position:absolute;
  top:60px;
  right:15px;
  background:#23272a;
  border-radius:10px;
  box-shadow:0 8px 24px #0006;
  overflow:hidden;
  z-index:2000;
  min-width:160px;
">
            <div class="menu-item" id="openCalendar">📅 Calendar</div>
            <div class="menu-item" id="openWorkouts">💪 Workouts</div>
            <div class="menu-item" id="openExercises">🏋️ Exercises</div>
        </div>
    </div>
    <div id="exerciseCardContainer">
        <div id="exerciseCard"></div>
    </div>
  

    <!-- Calendar Modal -->
    <div id="calendarModal"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000a; z-index:1000; justify-content:center; align-items:center;">
        <div class="calendar-modal-content">
            <div style="position:relative; width:100%;">

                <div id="closeCalendarModal" class="modal-close">✕</div>

                <div id="fullCalendar"></div>

            </div>

        </div>
    </div>

    <!-- Workout Modal -->

    <div id="workoutModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000a;
  z-index:1000;
  justify-content:center;
  align-items:center;
">
        <div style="
    background:#23272a;
    border-radius:18px;
    padding:24px;
    min-width:300px;
    max-width:90vw;
  ">


            <div style="position:relative;">

                <div id="closeWorkoutModal" class="modal-close">✕</div>
                <div style="font-size:18px; margin-bottom:16px; font-weight:600;">
                    Select Workout
                </div>

                <div id="workoutList"></div>

                
<div style="text-align:center; margin-top:8px;">
        <button id="manageWorkoutsBtn" class="full-width" style="max-width:320px; margin:8px auto; color:#fff; background:#6c3483;">Manage Workouts</button>
    </div>

            </div>
        </div>
    </div>
    
     <!-- Exercises Modal -->

    <div id="exercisesModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000a;
  z-index:1000;
  justify-content:center;
  align-items:center;
">
        <div style="
    background:#23272a;
    border-radius:18px;
    padding:24px;
    min-width:300px;
    max-width:90vw;
  ">


            <div style="position:relative;">

                <div id="closeExerciseModal" class="modal-close">✕</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px;">
                    <div style="font-size:18px; font-weight:600;">Exercises</div>
                    
                </div>
                

                <div id="exerciseList"></div>

                <button id="addExerciseBtn" class="save" style="padding:10px 14px; width:auto; font-size:14px; margin-top:10px;">+ Add</button>

                <div id="exerciseForm" style="display:none; margin-top:18px; padding-top:18px; border-top:1px solid #333;">
                    <input id="exerciseName" placeholder="Exercise name" type="text" style="width:100%; margin-bottom:10px; padding:12px; border-radius:8px; border:none; background:#1e1e1e; color:#fff; box-sizing:border-box;" />
                    <select id="exerciseType" style="width:100%; margin-bottom:14px; padding:12px; border-radius:8px; border:none; background:#1e1e1e; color:#fff; box-sizing:border-box;">
                        <option value="">Select Type</option>
                        <option value="Abs">Abs</option>
                        <option value="Back">Back</option>
                        <option value="Biceps">Biceps</option>
                        <option value="Chest">Chest</option>
                        <option value="Legs">Legs</option>
                        <option value="Shoulders">Shoulders</option>
                        <option value="Triceps">Triceps</option>
                    </select>
                    <div style="display:flex; gap:10px;">
                        <button id="exerciseFormSave" class="save" style="flex:1; padding:12px;">Save</button>
                        <button id="exerciseFormCancel" class="cancel" style="flex:1; padding:12px; background:#e74c3c;">Cancel</button>
                    </div>
                </div>

            </div>
        </div>
    </div>



    <!-- Manage Workouts Modal -->
    <div id="manageWorkoutsModal" style="
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#000a;
  z-index:1000;
  justify-content:center;
  align-items:center;
">
        <div style="
    background:#23272a;
    border-radius:18px;
    padding:24px;
    min-width:300px;
    max-width:90vw;
    width: min(640px, 90vw);
  ">
            <div style="position:relative;">
                <div id="closeManageWorkoutsModal" class="modal-close">✕</div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px;">
                    <div style="font-size:18px; font-weight:600;">Manage Workouts</div>
                </div>

                <div id="manageWorkoutsList" style="max-height:56vh; overflow:auto;"></div>

                <div id="workoutEditForm" style="display:none; margin-top:12px; padding-top:12px; border-top:1px solid #333;">
                    <input id="workoutNameInput" placeholder="Workout name" type="text" style="width:100%; margin-bottom:10px; padding:12px; border-radius:8px; border:none; background:#1e1e1e; color:#fff; box-sizing:border-box;" />

                    <div id="workoutExercisesList" style="max-height:220px; overflow:auto; margin-bottom:12px; padding:6px 0;">
                        <!-- populated dynamically with checkboxes for exercises -->
                    </div>

                    <div style="display:flex; gap:10px;">
                        <button id="workoutEditSave" class="save" style="flex:1; padding:12px;">Save</button>
                        <button id="workoutEditCancel" class="cancel" style="flex:1; padding:12px; background:#e74c3c;">Cancel</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
