<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCM45pVfshkhb4_oG8VX08S2blYQlA8nSA",
            authDomain: "workout-tracker-3bf5e.firebaseapp.com",
            projectId: "workout-tracker-3bf5e",
            storageBucket: "workout-tracker-3bf5e.firebasestorage.app",
            messagingSenderId: "1051835495537",
            appId: "1:1051835495537:web:d825f0a61ccce60f4bd7d0",
            measurementId: "G-7MK068BRL8"
        };


        firebase.initializeApp(firebaseConfig);
    </script>

</head>

<body>
    <h1>Workout Tracker</h1>
    <div class="top-bar">

        <div id="dateAndWorkout" class="date-workout">
            <div id="todayDate" class="today-date"></div>
            <div id="todayWorkout" class="today-workout"></div>
        </div>
        <button id="calendarBtn" class="menu-toggle">≡</button>
        <div id="menuDropdown" class="dropdown-menu">
            <div class="menu-item" id="openCalendar">📅 Calendar</div>
            <div class="menu-item" id="openWorkouts">💪 Workouts</div>
            <div class="menu-item" id="openExercises">🏋️ Exercises</div>
        </div>
    </div>
    <div id="exerciseCardContainer">
        <div id="exerciseCard"></div>
    </div>
  

    <!-- Calendar Modal -->
    <div id="calendarModal" class="modal-backdrop">
        <div class="calendar-modal-content">
            <div class="modal-inner">

                <div id="closeCalendarModal" class="modal-close">✕</div>

                <div id="fullCalendar"></div>

            </div>

        </div>
    </div>

    <!-- Workout Modal -->

    <div id="workoutModal" class="modal-backdrop">
        <div class="modal-dialog">

            <div class="modal-inner">

                <div id="closeWorkoutModal" class="modal-close">✕</div>
                <div class="modal-heading">
                    Select Workout
                </div>

                <div id="workoutList"></div>

                <div class="modal-action">
                    <button id="manageWorkoutsBtn" class="full-width save">Manage Workouts</button>
                </div>

            </div>
        </div>
    </div>
    
     <!-- Exercises Modal -->

    <div id="exercisesModal" class="modal-backdrop">
        <div class="modal-dialog">

            <div class="modal-inner">

                <div id="closeExerciseModal" class="modal-close">✕</div>
                <div class="modal-header-row">
                    <div class="modal-heading">Exercises</div>
                </div>

                <div id="exerciseList"></div>

                <button id="addExerciseBtn" class="save button-compact">+ Add</button>

                <div id="exerciseForm" class="modal-form-section">
                    <input id="exerciseName" class="form-input" placeholder="Exercise name" type="text" />
                    <select id="exerciseType" class="form-select">
                        <option value="">Select Type</option>
                        <option value="Abs">Abs</option>
                        <option value="Back">Back</option>
                        <option value="Biceps">Biceps</option>
                        <option value="Chest">Chest</option>
                        <option value="Legs">Legs</option>
                        <option value="Shoulders">Shoulders</option>
                        <option value="Triceps">Triceps</option>
                    </select>
                    <div class="form-row">
                        <button id="exerciseFormSave" class="save half-width">Save</button>
                        <button id="exerciseFormCancel" class="cancel half-width">Cancel</button>
                    </div>
                </div>

            </div>
        </div>
    </div>



    <!-- Manage Workouts Modal -->
    <div id="manageWorkoutsModal" class="modal-backdrop">
        <div class="modal-dialog wide">
            <div class="modal-inner">
                <div id="closeManageWorkoutsModal" class="modal-close">✕</div>
                <div class="modal-header-row">
                    <div class="modal-heading">Manage Workouts</div>
                </div>

                <div id="manageWorkoutsList" class="scrollable-list"></div>

                <div id="workoutEditForm" class="modal-form-section">
                    <input id="workoutNameInput" class="form-input" placeholder="Workout name" type="text" />

                    <div id="workoutExercisesList" class="scrollable-list spaced">
                    </div>

                    <div class="form-row">
                        <button id="workoutEditSave" class="save half-width">Save</button>
                        <button id="workoutEditCancel" class="cancel half-width">Cancel</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
